name: Gene-related grouping term - Request a new grouping/umbrella term
description: Request a new gene-related grouping (umbrella) term, to group existing Mondo terms related to the same gene.
title: Request for gene-related grouping term [ADD NAME HERE]
labels: [ "new term  gene-related grouping/umbrella" ]
# assignees: sabrinatoro
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a new gene-related **grouping** (umbrella) term, i.e. a new term intended to group several existing Mondo terms that relate to the same gene.
  - type: markdown
    attributes:
      value: |
        ## Requested umbrella term
  - type: input
    id: requested_name
    attributes:
      label: Requested name
      description: The label for the new umbrella term. Please use lowercase, unless the name contains a proper name or a gene symbol.
      placeholder: ex. PEX1-related peroxisome biogenesis disorder
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Gene-disease association
  - type: input
    id: gene
    attributes:
      label: Gene name and HGNC identifier
      description: |
        The gene this umbrella term relates to. Please give the HGNC gene symbol and its HGNC identifier, which you can look up at https://www.genenames.org.
      placeholder: ex. PEX1, HGNC:8850
    validations:
      required: true
  - type: textarea
    id: gene_disease_evidence
    attributes:
      label: Evidence for the gene-disease relation
      description: |
        Please provide the evidence supporting the relation between this gene and this disease, in the format PMID:####### or doi:########. More than one reference can be given.
      placeholder: ex. PMID:26387595
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Definition
  - type: textarea
    id: definition
    attributes:
      label: Suggested definition
      description: |
        Mondo writes definitions of gene-related diseases in the format: Any [parent class] in which the cause of the disease is a mutation in the [GENE] gene.
      placeholder: ex. Any peroxisome biogenesis disorder in which the cause of the disease is a mutation in the PEX1 gene.
    validations:
      required: false
  - type: textarea
    id: definition_evidence
    attributes:
      label: Evidence for the information in the definition
      description: |
        Please provide the reference(s) supporting the suggested definition, in the format PMID:####### or doi:########.
      placeholder: ex. PMID:26387595
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### Classification
  - type: textarea
    id: parents
    attributes:
      label: Mondo ID and name of the suggested parent term(s)
      description: |
        Every Mondo term needs at least one parent. Please give the Mondo ID and label of the term(s) this new umbrella term should be classified under. One per line.
      placeholder: ex. MONDO:0019234 peroxisome biogenesis disorder
    validations:
      required: true
  - type: textarea
    id: classification_evidence
    attributes:
      label: Evidence for the information in the classification
      description: |
        Please provide the reference(s) supporting the suggested classification, in the format PMID:####### or doi:########.
      placeholder: ex. PMID:26387595
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Terms to include under this term
  - type: textarea
    id: children
    attributes:
      label: Terms to include under this term
      description: |
        List the existing Mondo terms that should be grouped under this new umbrella term, **one per line**, in the format:
        `MONDO:ID ; Mondo term label ; evidence for this term to be grouped under this umbrella term`

        Please note that a grouping term is normally expected to have at least two children. If you only have one term to list, please explain why in the additional information below.
      placeholder: |
        ex. MONDO:0008953 ; peroxisome biogenesis disorder 1A (Zellweger) ; PMID:26387595
        MONDO:0011101 ; peroxisome biogenesis disorder 1B ; PMID:26387595
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Additional information
  - type: input
    id: orcid
    attributes:
      label: ORCID Identifier
      description: What is the ORCID identifier of the person requesting this term? ORCID identifiers can be made at https://orcid.org.
      placeholder: e.g. https://orcid.org/0000-0001-5208-3432
    validations:
      required: false
  - type: input
    id: website
    attributes:
      label: Working group URL
      description: Provide the website URL of the working group or community you'd like to be associated with this new term.
      placeholder: e.g. https://clinicalgenome.org/affiliation/40005/
    validations:
      required: false
  - type: textarea
    id: comments
    attributes:
      label: Comments
      description: |
        Please provide any additional comments here.
    validations:
      required: false
