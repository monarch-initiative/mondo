# Organizations that use Mondo (shown on /pages/users/ and the homepage)
# Fields: name, url (optional; leave out if the site is gone), description (Markdown links allowed in description)

- name: "Monarch Initiative"
  url: "https://monarchinitiative.org/"
  description: "Monarch is a system that allows for cross-species disease discovery, and Mondo was initially developed for the Monarch Initiative and is used for integrating disease data across species."
- name: "Biolookup"
  description: "The Biolookup Service provides metadata and ontological information about biomedical entities based on their compact identifiers (CURIEs)."
- name: "ClinGen"
  url: "https://clinicalgenome.org/"
  description: "ClinGen is a curated database of clinically relevant genes and variants. Mondo is used annotating diseases associated with gene variants."
- name: "Critical Path Institute"
  url: "https://c-path.org/"
  description: "An independent nonprofit, public-private partnership with the U.S. Food and Drug Administration (FDA) focused on the medical product development process."
- name: "European Bioinformatics Institute (EBI)"
  url: "https://www.ebi.ac.uk"
  description: "EBI uses Mondo as the primary ontology for disease concepts integrated into the  Experimental Factor Ontology (EFO) for integration of data across EBI. Mondo is used for disease annotations in [EBI resources](https://www.ebi.ac.uk/services), [Open Targets](https://www.opentargets.org/), GWAS catalog and [Euro-Bioimaging](http://www.eurobioimaging.eu/)."
- name: "European Joint Programme on Rare Diseases"
  url: "https://www.ejprarediseases.org/"
  description: "An Europe-based information resource for rare diseases."
- name: "Euro-Bioimaging"
  url: "https://www.eurobioimaging.eu/"
  description: "Provides access to bioimaging technologies, training and data services. Mondo is used for disease annotations."
- name: "Exscientia"
  url: "https://www.exscientia.ai/"
  description: "Exscientia is an AI-driven pharmatech company committed to discovering, designing and developing the best possible drugs in the fastest and most effective manner."
- name: "Fabric Genomics"
  url: "https://fabricgenomics.com/"
  description: "Genome interpretation software for use in rare disease diagnosis."
- name: "Gabriella Miller Kids First Data Resource Portal"
  url: "https://kidsfirstdrc.org/"
  description: "The Kids First Data Resource Portal is a curated database of clinical and genetic sequence data from pediatric patients with structural abnormalities or childhood cancers, and Mondo is used to structure diagnosis information."
- name: "Global Alliance for Genomics & Health (GA4GH)"
  url: "https://www.ga4gh.org/"
  description: "A policy-framing and technical standards-setting organization that aims to enable responsible genomic data sharing within a human rights framework."
- name: "Global Genes"
  url: "https://globalgenes.org/"
  description: "A non-profit organization dedicated to eliminating the burdens and challenges of rare diseases for patients and families globally."
- name: "HL7 International"
  url: "https://confluence.hl7.org/display/TA/External+Terminologies+-+Information"
  description: "A standards developing organization that provides a comprehensive framework and related standards for the exchange, integration, sharing and retrieval of electronic health information that supports clinical practice and the management, delivery and evaluation of health services."
- name: "Human Cell Atlas"
  url: "https://www.humancellatlas.org/"
  description: "A group of researchers who aim to create cellular reference maps with the position, function and characteristics of every cell type in the human body."
- name: "INDRA"
  url: "https://github.com/sorgerlab/indra"
  description: "INDRA (Integrated Network and Dynamical Reasoning Assembler) is an automated model assembly system, originally developed for molecular systems biology and then generalized to other domains."
- name: "Infertility Disease Database"
  url: "http://mdl.shsmu.edu.cn/IDDB/module/mainpage/mainpage.jsp"
  description: "A resource for genes, experiments and clinical records related with the infertility diseases."
- name: "MSeqDR: the Mitochondrial Disease Sequence Data Resource Consortium"
  url: "https://mseqdr.org/"
  description: "Securely collects and shares data for rare diseases, patients and causative mutations."
- name: "NCBI ClinVar"
  url: "https://www.ncbi.nlm.nih.gov/clinvar/"
  description: "ClinVar aggregates information about genomic variation and its relationship to human health."
- name: "NCBI MedGen"
  url: "https://www.ncbi.nlm.nih.gov/medgen/"
  description: "MedGen organizes information related to human medical genetics, such as attributes of conditions with a genetic contribution. MedGen maps their disease pages to Mondo IDs."
- name: "NCI Cancer Research Data Commons"
  url: "https://datascience.cancer.gov/data-commons"
  description: "A cloud-based data science infrastructure that connects data sets with analytics tools to allow users to share, integrate, analyze, and visualize cancer research data to drive scientific discovery."
- name: "Office of Orphan Products Development (OOPD) at U.S. Food and Drug Administration (FDA)"
  url: "https://www.fda.gov/about-fda/office-clinical-policy-and-programs/office-orphan-products-development"
  description: "The FDA Office of Orphan Products Development (OOPD) supports and advances the development and evaluation of new treatments for rare diseases."
- name: "OMIA"
  url: "https://omia.org"
  description: "Online Mendelian Inheritance in Animals (OMIA) is a catalogue/compendium of inherited disorders, other (single-locus) traits, and genes in 346 animal species."
- name: "Penn TURBO"
  description: "TURBO transforms relational electronic health record (EHR) data into a semantic graph. Mondo is used for disease annotations and integration of disease data."
- name: "Pharos"
  url: "https://pharos.nih.gov/diseases"
  description: "Pharos provides an interface to the Knowledge Management Center (KMC) for the Illuminating the Druggable Genome (IDG) program. Diseases in the Pharos database are mapped to Mondo terms and IDs."
- name: "Pombase"
  url: "https://www.pombase.org/"
  description: "A comprehensive database for the fission yeast Schizosaccharomyces pombe, providing structural and functional annotation, literature curation and access to large-scale data sets."
- name: "SunQuest"
  description: "Sunquest offers comprehensive laboratory informatics, including laboratory information management systems (LIS/LIMS), and lab analytics solutions for clinical pathology, anatomic pathology, and molecular pathology, including next-generation sequencing (NGS) for precision medicine."
